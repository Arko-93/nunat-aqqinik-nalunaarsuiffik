server {
    listen 3457;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json text/plain;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        default_type application/geo+json;
        add_header Access-Control-Allow-Origin *;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
