server {
    listen 3457;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    location /dist/ {
        autoindex on;
        default_type application/octet-stream;
        location ~* \.(json|geojson)$ {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
        }
        location ~* \.(csv|ndjson)$ {
            default_type text/plain;
            add_header Access-Control-Allow-Origin *;
        }
    }

    location /data/ {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
