server {
  listen 3459;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    default_type text/plain;
    return 200 'ok\n';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|geojson|json|pmtiles|woff2)$ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
